# nginx vhost for the guasimo LLM workstation.
#
# - terminates TLS (self-signed by default; swap to Let's Encrypt per
#   docs/06-networking-and-security.md).
# - reverse-proxies to Open WebUI on loopback 8080.
# - never proxies the Ollama API to the LAN; only Open WebUI reaches it.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 challenge passthrough if/when certbot is added.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/guasimo/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/guasimo/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Generous upload — file RAG.
    client_max_body_size 200m;

    # WebSocket + SSE streaming for chat.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # Health endpoint (unauthenticated, for LAN monitoring).
    location = /guasimo-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Connection upgrade map (required for WebSocket via proxy_set_header).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}